services:
  # FastAPI Backend Service
  fastapi:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://admin:password@mysql:3306/fastapi_db
      - ENVIRONMENT=development
      # Database connections for each module
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_CUSTOMER_PROFILE=customer_profile
      - DB_PRODUCT_STANDARD=product_standard
      - DB_TOURISM_ROUTE=tourism_route
      - DB_TOURISM_SITUATION=tourism_situation_report
      - DB_TOURIST_BEHAVIOR=tourist_behavior_survey
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - app_logs:/app/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "info"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fastapi_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/config:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_logs:/var/log/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-admin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
      PMA_ARBITRARY: 1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped
    volumes:
      - ./phpmyadmin/config:/etc/phpmyadmin/conf.d:ro

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  mysql_logs:
    driver: local
  app_logs:
    driver: local